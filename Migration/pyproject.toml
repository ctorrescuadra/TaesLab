[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "taespy"
version = "0.1.0"
description = "Thermoeconomic analysis toolbox for industrial energy systems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "TaesLab Team" }
]
keywords = [
  "thermoeconomics",
  "exergy",
  "energy-systems",
  "industrial-analysis",
  "process-engineering"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Information Analysis"
]

# Core runtime dependencies aligned to the package layout in Migration/python-package-blueprint.md
dependencies = [
  "numpy>=1.26,<3.0",
  "pandas>=2.1,<3.0",
  "pydantic>=2.8,<3.0",
  "openpyxl>=3.1,<4.0",
  "jsonschema>=4.23,<5.0",
  "networkx>=3.2,<4.0",
  "matplotlib>=3.8,<4.0"
]

[project.optional-dependencies]
# Extra numerical tools for advanced calculations
calc = [
  "scipy>=1.12,<2.0"
]

# Hardened/advanced XML support
xml = [
  "lxml>=5.2,<6.0",
  "defusedxml>=0.7.1,<1.0"
]

# Optional reporting and export tooling
report = [
  "jinja2>=3.1,<4.0",
  "tabulate>=0.9,<1.0",
  "xlsxwriter>=3.2,<4.0"
]

# Optional interactive and richer graph backends
viz = [
  "plotly>=5.24,<6.0",
  "pygraphviz>=1.13"
]

# Development and QA tooling
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<6.0",
  "hypothesis>=6.112,<7.0",
  "ruff>=0.6.9,<0.8",
  "black>=24.8,<25.0",
  "mypy>=1.11,<2.0",
  "build>=1.2,<2.0",
  "twine>=5.1,<6.0"
]

# Convenience bundle for full local setup
all = [
  "taespy[calc,xml,report,viz,dev]"
]

[project.urls]
Homepage = "https://github.com/ctorrescuadra/TaesLab"
Repository = "https://github.com/ctorrescuadra/TaesLab"
Issues = "https://github.com/ctorrescuadra/TaesLab/issues"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E203"]

[tool.mypy]
python_version = "3.10"
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
disallow_untyped_defs = true
check_untyped_defs = true
show_error_codes = true
pretty = true

